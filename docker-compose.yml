# Lokal utviklingsdatabase. Start med `bun run db:up`.
# Port 5433 for å ikke kollidere med andre Postgres-instanser på 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sporty
      POSTGRES_PASSWORD: sporty
      POSTGRES_DB: sporty
    ports:
      - '5433:5432'
    volumes:
      - sporty-db:/var/lib/postgresql/data

volumes:
  sporty-db:
