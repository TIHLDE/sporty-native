name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - All
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Expo SDK version, device/simulator, OS version, dev client vs Expo Go.
  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      render: shell
